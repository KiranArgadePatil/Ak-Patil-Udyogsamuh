<!DOCTYPE html><html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>मटेरियल फॉर्म | AK इलेक्ट्रिशियन</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#152033}.wrap{max-width:850px;margin:auto;padding:18px}.head{background:#071525;color:#fff;padding:22px;text-align:center;border-bottom:4px solid #ffc400;border-radius:16px 16px 0 0}.logo{width:64px;height:64px;border:3px solid #ffc400;border-radius:50%;display:inline-grid;place-items:center;font-size:22px;font-weight:900}.head h1{margin:8px 0 2px;font-size:24px}.head h2{margin:0;color:#ffc400;font-size:17px}.card{background:#fff;padding:18px;border-radius:0 0 16px 16px;box-shadow:0 10px 35px #07152518}.search{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:9px;font-size:15px}.all{display:flex;gap:10px;align-items:center;padding:14px 0;font-weight:700}.grid{display:grid;gap:9px}.item{display:grid;grid-template-columns:32px 1fr 90px;gap:10px;align-items:center;padding:11px;border:1px solid #dde3ea;border-radius:10px}.item input[type=checkbox]{width:20px;height:20px}.info b{display:block}.info small{color:#64748b}.qty{width:85px;padding:9px;border:1px solid #bfc9d6;border-radius:7px;font-size:15px}.selected{margin-top:22px;border-top:3px solid #ffc400;padding-top:15px}.selected-row{display:grid;grid-template-columns:38px 1fr 90px 45px;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #e7ebef}.remove{border:0;background:#fee2e2;color:#b91c1c;border-radius:7px;padding:9px;cursor:pointer}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.buttons button{flex:1;min-width:150px;padding:13px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.clear{background:#e5e7eb}.receipt{background:#071525;color:#fff}.summary{display:flex;justify-content:space-between;margin-top:12px;padding:14px;background:#f5f7fa;border-radius:9px;font-weight:800}@media(max-width:600px){.item{grid-template-columns:30px 1fr 78px}.selected-row{grid-template-columns:30px 1fr 72px 40px}.wrap{padding:8px}.card{padding:12px}}</style></head><body><div class="wrap"><header class="head"><div class="logo">AK</div><h1>AK Patil उद्योगसमूह</h1><h2>AK इलेक्ट्रिशियन — मटेरियल फॉर्म</h2></header><main class="card"><input id="search" class="search" placeholder="🔎 मटेरियल शोधा..."><label class="all"><input id="all" type="checkbox"> सर्व 79 मटेरियल Select करा</label><div id="grid" class="grid"></div><section class="selected"><h2>निवडलेले मटेरियल — संपादन</h2><p>खाली Quantity थेट बदलता येईल किंवा 🗑️ करून मटेरियल काढता येईल.</p><div id="selectedList"></div><div class="summary"><span>एकूण मटेरियल</span><span id="count">0</span><span>एकूण Quantity</span><span id="total">0</span></div></section><div class="buttons"><button class="clear" id="clear">सर्व Unselect करा</button><button class="receipt" id="make">🧾 मटेरियल फॉर्म तयार करा</button></div></main></div><script>
const materials=[[1,'मोदी पाईप LMS','25 mm'],[2,'मोदी पाईप MMS/LMS','20 mm'],[3,'बेंड','25/20 mm'],[4,'1 वे जंक्शन','25/20 mm'],[5,'2 वे जंक्शन','25/20 mm'],[6,'3 वे जंक्शन','25/20 mm'],[7,'4 वे जंक्शन','25/20 mm'],[8,'Y जंक्शन','25/20 mm'],[9,'फॅन बॉक्स','—'],[10,'सोल्युशन','—'],[11,'फॅन बॉक्स राउंड प्लेट','—'],[12,'राउंड प्लेट','—'],[13,'पट्टी','—'],[14,'पट्टी 1 वे जंक्शन','—'],[15,'पट्टी 2 वे जंक्शन','—'],[16,'पट्टी 3 वे जंक्शन','—'],[17,'पट्टी 4 वे जंक्शन','—'],[18,'स्क्रू','1 inch'],[19,'स्क्रू','1.5 inch'],[20,'स्क्रू','2.5 inch'],[21,'स्क्रू','4 inch'],[22,'रॉवळ प्लग','—'],[23,'इंडिकेटर','230V'],[24,'3 पिन सॉकेट','6A'],[25,'3 पिन सॉकेट','16A'],[26,'5 पिन सॉकेट','6A'],[27,'5 पिन सॉकेट','16A'],[28,'5 पिन सॉकेट','20A'],[29,'प्लग टॉप','3A'],[30,'प्लग टॉप','5A'],[31,'डिमर','—'],[32,'MCB','6A'],[33,'MCB','10A'],[34,'MCB','16A'],[35,'MCB','20A'],[36,'MCB','25A'],[37,'MCB','32A'],[38,'MCB','40A'],[39,'MCB बॉक्स','2/4/6/8/10-12 Way'],[40,'व्हायर होल्डर','—'],[41,'बटन','6A'],[42,'बटन','10A'],[43,'बटन','16A'],[44,'बटन','20A'],[45,'1 मॉड्युल प्लेट','1 Module'],[46,'2 मॉड्युल प्लेट','2 Module'],[47,'3 मॉड्युल प्लेट','3 Module'],[48,'4 मॉड्युल प्लेट','4 Module'],[49,'6 मॉड्युल प्लेट','6 Module'],[50,'8 मॉड्युल प्लेट','8 Module'],[51,'12 मॉड्युल प्लेट','12 Module'],[52,'16 मॉड्युल प्लेट','16 Module'],[53,'बॉक्स','2/3/4/6/8/12 Module'],[54,'सिंगल पोल MCB','6–63A'],[55,'डबल पोल MCB','6–63A'],[56,'RCCB','2P, 25/40/63A'],[57,'RCCB','4P, 25/40/63A'],[58,'RCBO','6–40A'],[59,'SP MCB बॉक्स','2/4 Way'],[60,'DP MCB बॉक्स','2/4 Way'],[61,'मेन स्विच','32A'],[62,'मेन स्विच','40A'],[63,'मेन स्विच','63A'],[64,'आयसोलेटर','2P'],[65,'आयसोलेटर','4P'],[66,'फ्यूज','5/10/16/32A'],[67,'फ्यूज होल्डर','5–32A'],[68,'फॅन रेग्युलेटर','1.5A'],[69,'बेल पुश','6A'],[70,'डोअर बेल','230V'],[71,'वायर','1 sq.mm'],[72,'वायर','1.5 sq.mm'],[73,'वायर','2.5 sq.mm'],[74,'वायर','4 sq.mm'],[75,'वायर','6 sq.mm'],[76,'वायर','10 sq.mm'],[77,'वायर','16 sq.mm'],[78,'सर्व्हिस वायर','2 Core'],[79,'सर्व्हिस केबल','2 Core']];
let selected={};try{selected=JSON.parse(localStorage.getItem('akSelectedMaterials')||'{}')}catch(e){selected={}}function save(){localStorage.setItem('akSelectedMaterials',JSON.stringify(selected))}function render(){const q=document.getElementById('search').value.toLowerCase();const g=document.getElementById('grid');g.innerHTML='';materials.filter(m=>(m[1]+' '+m[2]).toLowerCase().includes(q)).forEach(m=>{const row=document.createElement('div');row.className='item';row.innerHTML='<input type="checkbox" '+(selected[m[0]]?'checked':'')+'><div class="info"><b>'+m[0]+'. '+m[1]+'</b><small>'+m[2]+'</small></div><input class="qty" type="number" min="1" value="'+(selected[m[0]]||1)+'" '+(selected[m[0]]?'':'disabled')+'>';const cb=row.children[0],qt=row.children[2];cb.onchange=()=>{if(cb.checked)selected[m[0]]=Math.max(1,Number(qt.value)||1);else delete selected[m[0]];save();render()};qt.oninput=()=>{if(cb.checked){selected[m[0]]=Math.max(1,Number(qt.value)||1);save();renderSelected()}};g.appendChild(row)});document.getElementById('all').checked=Object.keys(selected).length===materials.length;renderSelected()}function renderSelected(){const box=document.getElementById('selectedList');box.innerHTML='';let total=0;let ids=Object.keys(selected);ids.forEach((id,i)=>{const m=materials.find(x=>x[0]==id),q=Number(selected[id])||1;total+=q;const r=document.createElement('div');r.className='selected-row';r.innerHTML='<span>'+String(i+1)+'</span><div><b>'+m[1]+'</b><small style="display:block;color:#64748b">'+m[2]+'</small></div><input class="qty" type="number" min="1" value="'+q+'"><button class="remove" type="button">🗑️</button>';r.children[2].oninput=()=>{selected[id]=Math.max(1,Number(r.children[2].value)||1);save();renderSelected();render()};r.children[3].onclick=()=>{delete selected[id];save();render()};box.appendChild(r)});document.getElementById('count').textContent=ids.length;document.getElementById('total').textContent=total}document.getElementById('search').oninput=render;document.getElementById('all').onchange=e=>{if(e.target.checked)materials.forEach(m=>selected[m[0]]=1);else selected={};save();render()};document.getElementById('clear').onclick=()=>{selected={};save();render()};document.getElementById('make').onclick=()=>{if(!Object.keys(selected).length){alert('कृपया मटेरियल Select करा.');return}alert('मटेरियल फॉर्म तयार आहे. खालील निवडलेले मटेरियल आणि Quantity संपादित करता येईल.');document.querySelector('.selected').scrollIntoView({behavior:'smooth'});};render();</script></body></html>
