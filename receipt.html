<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;font-family:Arial,"Noto Sans Devanagari",sans-serif;color:#152033}.receipt{max-width:760px;margin:24px auto;background:#fff;border-radius:18px;box-shadow:0 15px 45px #07152520;overflow:hidden}.head{background:#071525;color:#fff;padding:24px;text-align:center;border-bottom:5px solid #ffc400}.logo{width:70px;height:70px;border:3px solid #ffc400;border-radius:50%;display:inline-grid;place-items:center;font-size:24px;font-weight:900;color:#fff;margin-bottom:8px}.head h1{margin:0;font-size:25px}.head h2{margin:4px 0 0;color:#ffc400;font-size:18px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 22px;background:#f8fafc}.box{padding:12px;border:1px solid #e1e7ee;border-radius:10px;background:#fff}.date{text-align:right;padding:12px 22px 0;font-weight:700}.customer{padding:14px 22px;display:flex;gap:10px;align-items:center}.customer input{flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.table{width:calc(100% - 44px);margin:0 22px;border-collapse:collapse}.table th,.table td{border:1px solid #d7dee7;padding:10px}.table th{background:#071525;color:#fff}.center{text-align:center}.total{margin:14px 22px;padding:14px;background:#f5f7fa;border-radius:10px;text-align:right;font-size:18px;font-weight:800}.actions{display:flex;gap:10px;padding:18px 22px}.actions button{flex:1;border:0;border-radius:10px;padding:13px;font-weight:800;font-size:15px;cursor:pointer}.print{background:#071525;color:#fff}.wa{background:#16a34a;color:#fff}.back{background:#e8edf3;color:#152033;text-decoration:none;text-align:center;padding:13px;border-radius:10px;font-weight:800}.empty{text-align:center;padding:35px;color:#64748b}@media(max-width:600px){.receipt{margin:0;border-radius:0}.info{grid-template-columns:1fr}.table{width:calc(100% - 24px);margin:0 12px;font-size:13px}.table th,.table td{padding:7px}.customer{padding:12px}.date{padding-right:12px}.actions{padding:12px;flex-wrap:wrap}.actions>*{min-width:45%}}@media print{body{background:#fff}.receipt{margin:0;max-width:none;box-shadow:none;border-radius:0}.actions,.customer{display:none!important}.head{padding:14px}.info{padding:10px}.date{padding-top:6px}}
</style></head>
<body><main class="receipt">

const today=new Date();document.getElementById('today').textContent=String(today.getDate()).padStart(2,'0')+'/'+String(today.getMonth()+1).padStart(2,'0')+'/'+today.getFullYear();let selected={};try{selected=JSON.parse(localStorage.getItem('akSelectedMaterials')||'{}')}catch(e){};
const rows=document.getElementById('items');let total=0,n=0;materials.forEach(m=>{const q=Number(selected[m[0]]||0);if(q>0){n++;total+=q;const tr=document.createElement('tr');tr.innerHTML='<td class="center">'+n+'</td><td>'+m[1]+'</td><td>'+m[2]+'</td><td class="center">'+q+'</td>';rows.appendChild(tr)}});document.getElementById('total').textContent=total;document.getElementById('empty').style.display=n?'none':'block';
function sendWhatsApp(){if(!n){alert('मटेरियल Select केलेले नाही.');return}let text='AK Patil उद्योगसमूह\nAK इलेक्ट्रिशियन\nदिनांक: '+document.getElementById('today').textContent+'\n';const name=document.getElementById('customerName').value.trim();if(name)text+='ग्राहक: '+name+'\n';text+='\nपावती:\n';[...rows.querySelectorAll('tr')].forEach(r=>text+=r.cells[0].textContent+'. '+r.cells[1].textContent+' | '+r.cells[2].textContent+' | संख्या: '+r.cells[3].textContent+'\n');text+='\nएकूण संख्या: '+total;window.open('https://wa.me/918975482432?text='+encodeURIComponent(text),'_blank')}
</script></body></html>
