<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>पावती | AK इलेक्ट्रिशियन</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;font-family:Arial,'Noto Sans Devanagari',sans-serif;color:#111}.receipt{max-width:700px;margin:20px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 25px #0001}.head{text-align:center;border-bottom:2px solid #111;padding-bottom:15px}.logo{width:58px;height:58px;border:3px solid #111;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;margin-bottom:7px}.head h1{margin:3px 0;font-size:25px}.head h2{margin:3px 0;font-size:18px}.people{display:flex;justify-content:space-between;gap:15px;padding:15px 0;font-size:15px}.date{text-align:right;font-weight:700;margin-bottom:12px}.customer{display:flex;gap:10px;align-items:center;margin:10px 0}.customer input{flex:1;padding:11px;border:1px solid #ccc;border-radius:8px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{border:1px solid #ccc;padding:9px;text-align:left}.table th{background:#f0f0f0}.qty{text-align:center;width:90px}.total{display:flex;justify-content:flex-end;font-weight:700;font-size:18px;padding:14px 0}.buttons{display:flex;gap:10px;margin-top:15px}.buttons button{flex:1;padding:12px;border:0;border-radius:9px;font-weight:700;cursor:pointer}.wa{background:#25d366;color:#fff}.print{background:#111;color:#fff}.empty{text-align:center;padding:30px;color:#777}@media(max-width:600px){.receipt{margin:0;border-radius:0;padding:15px}.people{display:block;line-height:1.8}.table th,.table td{padding:7px;font-size:13px}}@media print{body{background:#fff}.receipt{box-shadow:none;margin:0;max-width:none}.buttons,.customer{display:none!important}}
</style></head>
<body><main class="receipt">
<header class="head"><div class="logo">AK</div><h1>AK Patil उद्योगसमूह</h1><h2>AK इलेक्ट्रिशियन</h2></header>
<section class="people"><div><b>श्री. अविनाश</b><br>मो. 8975482432</div><div><b>श्री. किरण आरगडे</b><br>मो. 7775940775</div></section>
<div class="date">दिनांक: <span id="today"></span></div>
<div class="customer"><label><b>ग्राहकाचे नाव:</b></label><input id="customerName" placeholder="ग्राहकाचे नाव"></div>
<table class="table"><thead><tr><th>क्र.</th><th>मटेरियल</th><th>Size</th><th class="qty">Quantity</th></tr></thead><tbody id="items"></tbody></table>
<div id="empty" class="empty">मटेरियल फॉर्ममधून मटेरियल Select केल्यावर येथे पावती तयार होईल.</div>
<div class="total">एकूण Quantity: <span id="total" style="margin-left:8px">0</span></div>
<div class="buttons"><button class="print" onclick="window.print()">🖨️ Print / PDF</button><button class="wa" onclick="sendWhatsApp()">💬 WhatsApp पावती</button></div>
</main>
<script>
const materials=[[1,'मोदी पाईप LMS','25 mm'],[2,'मोदी पाईप MMS/LMS','20 mm'],[3,'बेंड','25/20 mm'],[4,'1 वे जंक्शन','25/20 mm'],[5,'2 वे जंक्शन','25/20 mm'],[6,'3 वे जंक्शन','25/20 mm'],[7,'4 वे जंक्शन','25/20 mm'],[8,'Y जंक्शन','25/20 mm'],[9,'फॅन बॉक्स','—'],[10,'सोल्युशन','—'],[11,'फॅन बॉक्स राउंड प्लेट','—'],[12,'राउंड प्लेट','—'],[13,'पट्टी','—'],[14,'पट्टी 1 वे जंक्शन','—'],[15,'पट्टी 2 वे जंक्शन','—'],[16,'पट्टी 3 वे जंक्शन','—'],[17,'पट्टी 4 वे जंक्शन','—'],[18,'स्क्रू','1 inch'],[19,'स्क्रू','1.5 inch'],[20,'स्क्रू','2.5 inch'],[21,'स्क्रू','4 inch'],[22,'रॉवळ प्लग','—'],[23,'इंडिकेटर','230V'],[24,'3 पिन सॉकेट','6A'],[25,'3 पिन सॉकेट','16A'],[26,'5 पिन सॉकेट','6A'],[27,'5 पिन सॉकेट','16A'],[28,'5 पिन सॉकेट','20A'],[29,'प्लग टॉप','3A'],[30,'प्लग टॉप','5A'],[31,'डिमर','—'],[32,'MCB','6A'],[33,'MCB','10A'],[34,'MCB','16A'],[35,'MCB','20A'],[36,'MCB','25A'],[37,'MCB','32A'],[38,'MCB','40A'],[39,'MCB बॉक्स','2/4/6/8/10-12 Way'],[40,'व्हायर होल्डर','—'],[41,'बटन','6A'],[42,'बटन','10A'],[43,'बटन','16A'],[44,'बटन','20A'],[45,'1 मॉड्युल प्लेट','1 Module'],[46,'2 मॉड्युल प्लेट','2 Module'],[47,'3 मॉड्युल प्लेट','3 Module'],[48,'4 मॉड्युल प्लेट','4 Module'],[49,'6 मॉड्युल प्लेट','6 Module'],[50,'8 मॉड्युल प्लेट','8 Module'],[51,'12 मॉड्युल प्लेट','12 Module'],[52,'16 मॉड्युल प्लेट','16 Module'],[53,'बॉक्स','2/3/4/6/8/12 Module'],[54,'सिंगल पोल MCB','6–63A'],[55,'डबल पोल MCB','6–63A'],[56,'RCCB','2P, 25/40/63A'],[57,'RCCB','4P, 25/40/63A'],[58,'RCBO','6–40A'],[59,'SP MCB बॉक्स','2/4 Way'],[60,'DP MCB बॉक्स','2/4 Way'],[61,'मेन स्विच','32A'],[62,'मेन स्विच','40A'],[63,'मेन स्विच','63A'],[64,'आयसोलेटर','2P'],[65,'आयसोलेटर','4P'],[66,'फ्यूज','5/10/16/32A'],[67,'फ्यूज होल्डर','5–32A'],[68,'फॅन रेग्युलेटर','1.5A'],[69,'बेल पुश','6A'],[70,'डोअर बेल','230V'],[71,'वायर','1 sq.mm'],[72,'वायर','1.5 sq.mm'],[73,'वायर','2.5 sq.mm'],[74,'वायर','4 sq.mm'],[75,'वायर','6 sq.mm'],[76,'वायर','10 sq.mm'],[77,'वायर','16 sq.mm'],[78,'सर्व्हिस वायर','2 Core'],[79,'सर्व्हिस केबल','2 Core']];
const today=new Date();document.getElementById('today').textContent=String(today.getDate()).padStart(2,'0')+'/'+String(today.getMonth()+1).padStart(2,'0')+'/'+today.getFullYear();
let selected={};try{selected=JSON.parse(localStorage.getItem('akSelectedMaterials')||'{}')}catch(e){};
function render(){const tbody=document.getElementById('items');tbody.innerHTML='';let total=0,n=0;materials.forEach(m=>{const q=Number(selected[m[0]]||0);if(q>0){n++;total+=q;const tr=document.createElement('tr');tr.innerHTML=`<td>${n}</td><td>${m[1]}</td><td>${m[2]}</td><td class="qty">${q}</td>`;tbody.appendChild(tr)}});document.getElementById('total').textContent=total;document.getElementById('empty').style.display=n?'none':'block'}
function sendWhatsApp(){const rows=[...document.querySelectorAll('#items tr')];if(!rows.length){alert('मटेरियल निवडलेले नाही.');return}let text='AK Patil उद्योगसमूह\nAK इलेक्ट्रिशियन\n\nश्री. अविनाश - 8975482432\nश्री. किरण आरगडे - 7775940775\nदिनांक: '+document.getElementById('today').textContent+'\n';const name=document.getElementById('customerName').value.trim();if(name)text+='ग्राहक: '+name+'\n';text+='\nपावती:\n';rows.forEach(r=>text+=r.cells[0].textContent+'. '+r.cells[1].textContent+' | '+r.cells[2].textContent+' | संख्या: '+r.cells[3].textContent+'\n');text+='\nएकूण Quantity: '+document.getElementById('total').textContent;window.open('https://wa.me/918975482432?text='+encodeURIComponent(text),'_blank')}
render();
</script></body></html>
