rAll('#items tr')),rowsPerPage=12,totalPages=Math.ceil(rows.length/rowsPerPage),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});for(let p=0;p<totalPages;p++){const clone=document.getElementById('receipt').cloneNode(true),body=clone.querySelector('#items');Array.from(body.children).forEach((r,i)=>{if(i<p*rowsPerPage||i>=(p+1)*rowsPerPage)r.remove()});const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:850px;background:#fff';holder.appendChild(clone);document.body.appendChild(holder);await new Promise(r=>requestAnimationFrame(r));const canvas=await html2canvas(clone,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#fff',logging:false});holder.remove();if(p)pdf.addPage();const margin=6,ratio=Math.min((210-margin*2)/canvas.width,(297-margin*2)/canvas.height),w=canvas.width*ratio,h=canvas.height*ratio;pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',(210-w)/2,margin,w,h,'','FAST')}const blob=pdf.output('blob'),file=new File([blob],'AK-Electrician-Pavati.pdf',{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({title:'AK इलेक्ट्रिशियन पावती PDF',text:'पूर्ण पावती PDF',files:[file]});else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='AK-Electrician-Pavati.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);alert('पूर्ण PDF तयार झाली आहे.')} }catch(e){if(e.name!=='AbortError')alert('PDF तयार करताना समस्या आली.')}finally{btn.disabled=false;btn.textContent='💬 WhatsApp पावती PDF'}}</script></body></html>
